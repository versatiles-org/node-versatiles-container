name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "!**" # Don't run twice on commits with tags
  pull_request:
  workflow_dispatch:

env:
  FORCE_COLOR: 1

jobs:
  release:
    name: Lint and test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24] # 22 is the minimum supported version, see "engines" in package.json
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check vulnerabilities
        run: npm audit --omit dev

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Ensure Install # to ensure that binaries (like "vrt") are linked, so they can be used with "npx"
        run: npm i

      - name: Tests
        run: npm run test

      - name: Generate test coverage
        run: npm run test-coverage

      - name: Upload test coverage
        if: matrix.node-version == 24
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
